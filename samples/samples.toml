# Real camera files for the opt-in real-samples test (crates/revenant-core/tests/real_samples.rs).
#
# Every file comes from raw.pixls.us, whose samples are released under CC0 1.0 (public domain dedication); the site marks
# each sample's license and every one below is marked CC0. These files are test DATA: they are never committed. Run
# `scripts/fetch-samples.sh` to download them into `samples/cache/` (gitignored); it checks each SHA-256.
#
# Fields: `name` = file name in the cache, `kind` = the engine's expected kind (`FileKind::as_str`), `url`, `sha256`,
# `license`. Keep this file in the simple `key = "value"` form: the script and the test read it without a TOML parser.
#
# No HEIC: raw.pixls.us has none, and no other HEIC sample with a verifiable CC0/public-domain license was found.

