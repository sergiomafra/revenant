name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest # arm64
          - macos-15-intel # x86_64
          - windows-latest # x64
          - windows-11-arm # ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  samples:
    name: real camera samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: samples/cache
          key: samples-${{ hashFiles('samples/samples.toml') }}
      # Downloads from raw.pixls.us: an outage of that site must not fail the build, so only this step may fail, and the
      # test is skipped without the samples. A failing test (a real-sample regression) fails the build.
      - name: Fetch samples
        id: fetch
        continue-on-error: true
        run: scripts/fetch-samples.sh
      - name: Test
        if: steps.fetch.outcome == 'success'
        run: cargo test -p revenant-core --test real_samples -- --ignored --nocapture
        env:
          REVENANT_SAMPLES: samples/cache
