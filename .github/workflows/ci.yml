name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest # arm64
          - macos-15-intel # x86_64
          - windows-latest # x64
          - windows-11-arm # ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Some engine tests only exist in release builds (for example: a measurement breaking the pieces contract is
  # ignored in release, while debug builds assert on it), so one runner also runs the engine's tests in release.
  release:
    name: test (release, engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (release)
        run: cargo test --release -p revenant-core

  # Opt-in: the engine against a real \\.\PhysicalDriveN backed by a fixed VHD that the test itself creates with
  # diskpart in its temp dir (the runner is Administrator). The test detaches the VHD in a drop guard; the last step
  # detaches anything a crash left behind, found by the test's own folder name (never another disk).
  windows-devices:
    name: real devices (Windows VHD)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test against a VHD
        run: cargo test -p revenant-core --test os_devices_windows -- --ignored --test-threads=1 --nocapture
        env:
          REVENANT_OS_DEV: 1
      - name: Detach leftover VHDs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:TEMP -Directory -Filter 'revenant-vhd-*' -ErrorAction SilentlyContinue | ForEach-Object {
            $vhd = Join-Path $_.FullName 'card.vhd'
            if (Test-Path $vhd) {
              $script = Join-Path $env:RUNNER_TEMP 'detach.txt'
              Set-Content -Path $script -Value "select vdisk file=`"$vhd`"`r`ndetach vdisk"
              diskpart /s $script
              Write-Host "detached (or was not attached): $vhd"
            }
          }

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  samples:
    name: real camera samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: samples/cache
          key: samples-${{ hashFiles('samples/samples.toml') }}
      # Downloads from raw.pixls.us: an outage of that site must not fail the build, so only this step may fail, and the
      # test is skipped without the samples. A failing test (a real-sample regression) fails the build.
      - name: Fetch samples
        id: fetch
        continue-on-error: true
        run: scripts/fetch-samples.sh
      - name: Test
        if: steps.fetch.outcome == 'success'
        run: cargo test -p revenant-core --test real_samples -- --ignored --nocapture
        env:
          REVENANT_SAMPLES: samples/cache
