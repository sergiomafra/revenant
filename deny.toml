[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
]

[licenses.private]
# Workspace crates are GPL-3.0-only (ours); only third-party dependencies are checked.
ignore = true

[bans]
multiple-versions = "warn"
