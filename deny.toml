# Revenant ships only for macOS and Windows: the Linux-only GTK crates Tauri pulls in are
# never built into the app, so they are left out of the graph.
[graph]
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
# Vulnerabilities and unsound code fail for any crate; "unmaintained" fails only for our
# direct dependencies (transitive ones, like Tauri's unic-* crates, are not ours to swap).
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    # MPL-2.0 only for unmodified runtime dependencies (Sergio, 2026-11-03; spec 2.1 design).
    "MPL-2.0",
    # The exception only grants extra permission on top of Apache-2.0 (target-lexicon).
    "Apache-2.0 WITH LLVM-exception",
]

[licenses.private]
# Workspace crates are GPL-3.0-only (ours); only third-party dependencies are checked.
ignore = true

[bans]
multiple-versions = "warn"
