[package]
name = "revenant-dev"
description = "Revenant developer command line (not the end-user app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
revenant-core = { path = "../revenant-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
revenant-testkit = { path = "../revenant-testkit" }
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
