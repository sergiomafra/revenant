[package]
name = "revenant-app"
description = "Revenant desktop app (Tauri shell around the engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "revenant_app"

[[bin]]
name = "revenant"
path = "src/main.rs"

[dependencies]
revenant-core = { path = "../revenant-core" }
# Tauri 2.12 needs Rust 1.90; 2.11 is the newest line that builds on the workspace MSRV (1.88).
tauri = { version = "~2.11", features = [] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }
